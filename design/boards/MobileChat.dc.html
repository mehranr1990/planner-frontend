<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Assistant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A17}a:hover{color:#1A1A17}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 20px 16px 0; background: #F1F1EE; font-family: 'Urbanist', system-ui, sans-serif; color: #1A1A17; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="MobileHome.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 24px; font-weight: 600">Assistant</h1>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #45453F"><span style="width: 7px; height: 7px; border-radius: 50%; background: #4FE3C1"></span>Online</span>
  </header>

  <!-- Chat card with notched avatar -->
  <section aria-label="Conversation" style="position: relative; height: 640px; box-sizing: border-box; border-radius: 30px; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <div aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 66px; height: 66px; background: #F1F1EE; border-bottom-left-radius: 28px"></div>
    <div aria-hidden="true" style="position: absolute; top: 0; right: 66px; width: 28px; height: 28px; background: radial-gradient(circle at 0 100%, transparent 27.5px, #F1F1EE 28px)"></div>
    <div aria-hidden="true" style="position: absolute; top: 66px; right: 0; width: 28px; height: 28px; background: radial-gradient(circle at 0 100%, transparent 27.5px, #F1F1EE 28px)"></div>
    <span role="img" aria-label="Assistant" style="position: absolute; top: 0; right: 0; width: 54px; height: 54px; border-radius: 50%; background: #0E6B57; display: inline-flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"></path></svg></span>

    <div role="tablist" aria-label="Assistant views" style="display: flex; gap: 6px">
      <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{v.sel}}" onClick="{{ v.pick }}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: {{v.bg}}; color: {{v.fg}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{v.label}}</button>
      </sc-for>
    </div>

    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-top: 6px">
      <div style="align-self: flex-start; max-width: 82%; background: #F1F1EE; border-radius: 18px 18px 18px 6px; padding: 11px 14px; font-size: 14px; line-height: 1.45">Hi Mehran! Today you have <b>3 meetings</b> and <b>2 urgent tasks</b>.</div>
      <div style="align-self: flex-end; max-width: 75%; background: #0E6B57; color: #FFFFFF; border-radius: 18px 18px 6px 18px; padding: 11px 14px; font-size: 14px">Plan my afternoon</div>

      <!-- Plan card -->
      <div style="align-self: stretch; border-radius: 22px; background: #F8F8F6; box-shadow: inset 0 0 0 1px #EDEDEA; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 700">Suggested plan</span>
        <sc-for list="{{plan}}" as="p" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="flex: none; width: 52px; font-size: 12px; font-weight: 700; color: #45453F">{{p.time}}</span>
            <span style="flex: none; width: 4px; height: 32px; border-radius: 2px; background: {{p.color}}"></span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 600">{{p.title}}</span><span style="font-size: 11px; font-weight: 600; color: {{p.deep}}">{{p.scope}}</span></div>
          </div>
        </sc-for>
        <div style="display: flex; gap: 8px; padding-top: 2px">
          <button type="button" style="flex: 1; height: 44px; border: 0; border-radius: 999px; background: #0E6B57; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Add to calendar</button>
          <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #E6E6E1; color: #1A1A17; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Edit</button>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 8px; overflow-x: auto">
      <button type="button" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #D3D3CC; border-radius: 999px; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; color: #1A1A17; cursor: pointer">Summarize launch</button>
      <button type="button" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #D3D3CC; border-radius: 999px; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; color: #1A1A17; cursor: pointer">Who’s overloaded?</button>
      <button type="button" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #D3D3CC; border-radius: 999px; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; color: #1A1A17; cursor: pointer">Move overdue</button>
    </div>

    <div style="display: flex; align-items: center; gap: 4px; height: 54px; padding: 0 6px 0 16px; border-radius: 999px; background: #F1F1EE">
      <label for="m-assist" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
      <input id="m-assist" type="text" placeholder="Ask anything…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: #1A1A17">
      <button type="button" aria-label="Voice" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#45453F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      <button type="button" aria-label="Send" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #0E6B57; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="#C8FF3D" aria-hidden="true"><path d="M5 4l15 8-15 8 3-8z"></path></svg></button>
    </div>
  </section>

  <!-- Bottom nav -->
  <nav aria-label="Primary" style="position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 5; height: 72px; box-sizing: border-box; padding: 0 8px; border-radius: 36px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(14,14,12,0.06); display: flex; align-items: center">
    <div aria-hidden="true" style="position: absolute; top: 0; left: 50%; width: 80px; margin-left: -40px; height: 48px; background: #F1F1EE; border-radius: 0 0 40px 40px"></div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: calc(50% - 60px); width: 20px; height: 20px; background: radial-gradient(circle at 0 100%, transparent 19.5px, #F1F1EE 20px)"></div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: calc(50% + 40px); width: 20px; height: 20px; background: radial-gradient(circle at 100% 100%, transparent 19.5px, #F1F1EE 20px)"></div>
    <a href="#" aria-label="New task" style="position: absolute; top: -16px; left: 50%; margin-left: -30px; width: 60px; height: 60px; border-radius: 50%; background: #0E6B57; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="MobileHome.dc.html" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E5E58; font-size: 11px; font-weight: 600"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5E5E58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg></span>Today</a>
    <a href="MobileTasks.dc.html" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E5E58; font-size: 11px; font-weight: 600"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5E5E58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8 12l3 3 5-6"></path></svg></span>Tasks</a>
    <span style="flex: none; width: 84px"></span>
    <a href="MobileFlow.dc.html" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E5E58; font-size: 11px; font-weight: 600"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5E5E58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5zM18 15.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5zM8.5 6H14a4 4 0 0 1 0 8h-4a4 4 0 0 0 0 8"></path></svg></span>Flow</a>
    <a href="MobileChat.dc.html" aria-current="page" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E6B57; font-size: 11px; font-weight: 700"><span style="width: 44px; height: 28px; border-radius: 999px; background: #DDFAF2; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0E6B57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>Assistant</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'chat' };
  }
  renderVals() {
    const V = [['chat', 'Chat'], ['plan', 'Plan'], ['help', 'Help']];
    return {
      views: V.map(([id, label]) => {
        const on = id === this.state.view;
        return { label, sel: on ? 'true' : 'false', bg: on ? '#0E6B57' : '#F1F1EE', fg: on ? '#FFFFFF' : '#45453F', pick: () => this.setState({ view: id }) };
      }),
      plan: [
        { time: '2:00 pm', title: 'Client video call', scope: 'Project · Product Launch', color: '#5AB4FF', deep: '#0F5BA8' },
        { time: '3:00 pm', title: 'Design review', scope: 'Team · Design', color: '#8B8BFF', deep: '#4343C8' },
        { time: '4:30 pm', title: 'Focus: revamp sidebar', scope: 'Personal', color: '#4FE3C1', deep: '#0E6B57' }
      ]
    };
  }
}
</script>
</body>
</html>
