<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Case Flow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A17}a:hover{color:#1A1A17}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 20px 16px 0; background: #F1F1EE; font-family: 'Urbanist', system-ui, sans-serif; color: #1A1A17; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="MobileTasks.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #0F5BA8"><span style="width: 7px; height: 7px; border-radius: 50%; background: #5AB4FF"></span>Case #2041</span><h1 style="margin: 0; font-size: 24px; font-weight: 600">Case flow</h1></div>
    <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; background: #E0F0FF; color: #0F5BA8; font-size: 12px; font-weight: 700">3/5</span>
  </header>

  <!-- Notched panel -->
  <section aria-label="Case flow board" style="position: relative; border-radius: 30px; background: #FFFFFF; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px">
    <div aria-hidden="true" style="position: absolute; top: 0; left: 50%; width: 220px; margin-left: -110px; height: 64px; background: #F1F1EE; border-radius: 0 0 32px 32px"></div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: calc(50% - 110px - 24px); width: 24px; height: 24px; background: radial-gradient(circle at 0 100%, transparent 23.5px, #F1F1EE 24px)"></div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: calc(50% + 110px); width: 24px; height: 24px; background: radial-gradient(circle at 100% 100%, transparent 23.5px, #F1F1EE 24px)"></div>
    <div style="position: absolute; top: 4px; left: 50%; width: 200px; margin-left: -100px; display: flex; justify-content: center; gap: 4px">
      <sc-for list="{{crew}}" as="p" hint-placeholder-count="4">
        <div style="position: relative; width: 44px; height: 56px; display: flex; justify-content: center">
          <span style="width: 44px; height: 44px; border-radius: 50%; background: {{p.bg}}; color: {{p.fg}}; border: 3px solid #FFFFFF; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{p.init}}</span>
          <span style="position: absolute; bottom: 0; left: 50%; margin-left: -10px; width: 20px; height: 20px; border-radius: 50%; background: {{p.badgeBg}}; color: {{p.badgeFg}}; border: 2px solid #F1F1EE; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{p.badge}}</span>
        </div>
      </sc-for>
    </div>
    <div style="height: 64px; display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Add step" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #D3D3CC; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <button type="button" aria-label="Share" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #D3D3CC; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 12v7h14v-7"></path></svg></button>
    </div>

    <!-- Stage switcher -->
    <div role="tablist" aria-label="Stage" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #F1F1EE">
      <sc-for list="{{stages}}" as="s" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{s.sel}}" onClick="{{ s.pick }}" style="flex: 1; height: 40px; border: 0; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">{{s.label}}</button>
      </sc-for>
    </div>

    <!-- Steps with rail -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
        <div style="display: flex; align-items: stretch; gap: 8px">
          <div aria-hidden="true" style="position: relative; flex: none; width: 16px; display: flex; align-items: center; justify-content: center">
            <span style="position: relative; z-index: 1; width: 12px; height: 12px; border-radius: 50%; background: {{st.dot}}; border: 2px solid #FFFFFF; box-sizing: border-box"></span>
            <span style="position: absolute; left: 7px; top: 50%; height: {{st.lineH}}; border-left: 2px {{st.lineStyle}} {{st.lineColor}}"></span>
          </div>
          <div style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 8px 0 6px; border-radius: 18px; background: {{st.bg}}; display: flex; align-items: center; gap: 10px">
            <span style="flex: none; width: 38px; height: 38px; border-radius: 50%; background: {{st.avBg}}; color: {{st.avFg}}; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">{{st.init}}</span>
            <span style="flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; font-weight: {{st.weight}}; color: {{st.fg}}">{{st.label}}</span>
            <sc-if value="{{st.done}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Done"><path d="M2 12l4 4 8-8M10 16l8-8"></path></svg></sc-if>
            <sc-if value="{{st.open}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1A1A17" role="img" aria-label="Pending"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></sc-if>
          </div>
        </div>
      </sc-for>
    </div>

    <span style="font-size: 13px; font-weight: 700; padding: 2px 4px 0">Next tasks</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 70px; border: 0; border-radius: 20px; background: #0E6B57; color: #FFFFFF; padding: 12px 14px; text-align: left; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer"><span style="width: 7px; height: 7px; border-radius: 50%; background: #C8FF3D"></span>Request processing</button>
      <button type="button" style="height: 70px; border: 0; border-radius: 20px; background: #F8F8F6; box-shadow: inset 0 0 0 1px #EDEDEA; color: #1A1A17; padding: 12px 14px; text-align: left; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: flex-end; cursor: pointer">Problem resolution</button>
      <button type="button" style="height: 70px; border: 0; border-radius: 20px; background: #F8F8F6; box-shadow: inset 0 0 0 1px #EDEDEA; color: #1A1A17; padding: 12px 14px; text-align: left; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: flex-end; cursor: pointer">Customer update</button>
      <button type="button" style="height: 70px; border: 1.5px dashed #A9A9A1; border-radius: 20px; background: transparent; color: #45453F; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#45453F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
    </div>
  </section>

  <!-- Bottom nav -->
  <nav aria-label="Primary" style="position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 5; height: 72px; box-sizing: border-box; padding: 0 8px; border-radius: 36px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(14,14,12,0.06); display: flex; align-items: center">
    <div aria-hidden="true" style="position: absolute; top: 0; left: 50%; width: 80px; margin-left: -40px; height: 48px; background: #F1F1EE; border-radius: 0 0 40px 40px"></div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: calc(50% - 60px); width: 20px; height: 20px; background: radial-gradient(circle at 0 100%, transparent 19.5px, #F1F1EE 20px)"></div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: calc(50% + 40px); width: 20px; height: 20px; background: radial-gradient(circle at 100% 100%, transparent 19.5px, #F1F1EE 20px)"></div>
    <a href="#" aria-label="New task" style="position: absolute; top: -16px; left: 50%; margin-left: -30px; width: 60px; height: 60px; border-radius: 50%; background: #0E6B57; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="MobileHome.dc.html" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E5E58; font-size: 11px; font-weight: 600"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5E5E58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg></span>Today</a>
    <a href="MobileTasks.dc.html" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E5E58; font-size: 11px; font-weight: 600"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5E5E58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8 12l3 3 5-6"></path></svg></span>Tasks</a>
    <span style="flex: none; width: 84px"></span>
    <a href="MobileFlow.dc.html" aria-current="page" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E6B57; font-size: 11px; font-weight: 700"><span style="width: 44px; height: 28px; border-radius: 999px; background: #DDFAF2; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0E6B57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5zM18 15.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5zM8.5 6H14a4 4 0 0 1 0 8h-4a4 4 0 0 0 0 8"></path></svg></span>Flow</a>
    <a href="MobileChat.dc.html" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5E5E58; font-size: 11px; font-weight: 600"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5E5E58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>Assistant</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 'ident' };
  }
  renderVals() {
    const SKY = '#5AB4FF', RED = '#E5484D';
    const crewP = (init, bg, fg, badge, kind) => ({ init, bg, fg, badge, badgeBg: kind === 'sky' ? SKY : kind === 'red' ? RED : '#FFFFFF', badgeFg: kind === 'red' ? '#FFFFFF' : '#0E6B57' });
    const ST = [['alloc', 'Allocation'], ['ident', 'Identification'], ['resol', 'Resolution']];
    const raw = [
      ['SP', '#ECECFF', '#4343C8', 'Identify issue category', 'done'],
      ['SP', '#ECECFF', '#4343C8', 'Identify issue severity', 'done'],
      ['KF', '#E0F0FF', '#0F5BA8', 'Identify issue impact', 'done'],
      ['JK', '#DDFAF2', '#0E6B57', 'Allocate to resolution team', 'current'],
      ['AL', '#F4E9FF', '#7A2BC4', 'Advise customer of estimate', 'open']
    ];
    const steps = raw.map(([init, avBg, avFg, label, state], i) => {
      const done = state === 'done';
      const last = i === raw.length - 1;
      return {
        init, avBg, avFg, label, done, open: !done,
        dot: done ? SKY : RED,
        lineH: last ? '0px' : '60px',
        lineStyle: done && raw[i + 1][4] === 'done' ? 'solid' : 'dashed',
        lineColor: done && raw[i + 1] && raw[i + 1][4] === 'done' ? SKY : RED,
        bg: state === 'current' ? '#F1F1EE' : '#F8F8F6',
        fg: done ? '#6B6B64' : '#1A1A17',
        weight: state === 'current' ? 700 : 500
      };
    });
    return {
      crew: [crewP('HB', '#E0F0FF', '#0F5BA8', '2', 'sky'), crewP('SP', '#ECECFF', '#4343C8', '3', 'sky'), crewP('KF', '#DDFAF2', '#0E6B57', '1', 'red'), crewP('AL', '#F4E9FF', '#7A2BC4', '+', 'plus')],
      stages: ST.map(([id, label]) => {
        const on = id === this.state.stage;
        return { label, sel: on ? 'true' : 'false', bg: on ? '#0E6B57' : 'transparent', fg: on ? '#FFFFFF' : '#45453F', pick: () => this.setState({ stage: id }) };
      }),
      steps
    };
  }
}
</script>
</body>
</html>
