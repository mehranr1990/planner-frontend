<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule Bar &amp; Workspace Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A17}a:hover{color:#0E0E0C}
</style>
</helmet>
<div style="width: 1440px; height: 340px; box-sizing: border-box; padding: 48px 56px; background: #F1F1EE; font-family: 'Urbanist', system-ui, sans-serif; color: #1A1A17; display: flex; flex-direction: column; gap: 44px">

  <!-- Row 1: logo · schedule bar · actions -->
  <header style="display: flex; align-items: center; gap: 20px">
    <a href="#" aria-label="Planner home" style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #0E0E0C; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 19L19 5M9 5h10v10"></path></svg></a>

    <!-- Schedule bar -->
    <section aria-label="Your schedule" style="flex: 1; min-width: 0; height: 76px; box-sizing: border-box; padding: 8px; border-radius: 999px; background: #0E0E0C; display: flex; align-items: center; gap: 8px">
      <span style="flex: none; padding: 0 10px 0 18px; font-size: 17px; font-weight: 500; color: #FFFFFF">Your schedule</span>
      <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px 0 6px; border: 1px solid #2C2C28; border-radius: 999px; background: #1A1A17; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><span style="width: 40px; height: 40px; border-radius: 50%; background: #2C2C28; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></span>28 March</button>

      <!-- Timeline -->
      <div style="flex: 1; min-width: 0; height: 60px; box-sizing: border-box; padding: 0 6px; border-radius: 999px; background: #C8FF3D; display: flex; align-items: center; gap: 14px">
        <!-- past event -->
        <div style="flex: none; display: flex; align-items: center; gap: 10px; opacity: 0.7">
          <span style="width: 46px; height: 46px; border-radius: 50%; background: #E0F0FF; color: #0F5BA8; border: 3px solid #FFFFFF; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">HB</span>
          <span style="font-size: 12px; font-weight: 600; color: #2E3B08">30 min</span>
          <button type="button" aria-label="Open past event" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(14,14,12,0.18); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E0E0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></button>
        </div>
        <span aria-hidden="true" style="flex: none; width: 1px; height: 26px; background: rgba(14,14,12,0.2)"></span>
        <span style="flex: none; font-size: 13px; font-weight: 600; color: #0E0E0C">2:00 pm</span>

        <!-- current event with now-marker -->
        <div style="position: relative; flex: 1; min-width: 220px; height: 48px; border-radius: 999px; background: rgba(255,255,255,0.4); display: flex; align-items: center">
          <div style="width: 26%; min-width: 108px; height: 48px; box-sizing: border-box; padding-left: 4px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center">
            <span style="width: 40px; height: 40px; border-radius: 50%; background: #ECECFF; color: #4343C8; border: 2px solid #FFFFFF; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">PT</span>
            <span style="width: 40px; height: 40px; margin-left: -8px; border-radius: 50%; background: #DDFAF2; color: #0E6B57; border: 2px solid #FFFFFF; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">JK</span>
          </div>
          <span style="margin-left: 14px; font-size: 13px; font-weight: 600; color: #0E0E0C">Client video call</span>
          <span style="margin-left: auto; margin-right: 4px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.7); display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0E0E0C" stroke-width="1.8" stroke-linejoin="round" role="img" aria-label="Video call"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg></span>
          <!-- now marker -->
          <div aria-hidden="true" style="position: absolute; left: 26%; top: -14px; bottom: -8px; width: 2px; margin-left: -1px; background: #0E0E0C"></div>
          <span style="position: absolute; left: 26%; top: -26px; transform: translateX(-50%); height: 22px; padding: 0 9px; border-radius: 999px; background: #0E0E0C; color: #C8FF3D; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap">Now · 2:15 pm</span>
          <span aria-hidden="true" style="position: absolute; left: 26%; bottom: -11px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #0E0E0C"></span>
        </div>

        <span aria-hidden="true" style="flex: none; width: 1px; height: 26px; background: rgba(14,14,12,0.2)"></span>
        <span style="flex: none; font-size: 13px; font-weight: 600; color: #0E0E0C">3:00 pm</span>
        <!-- next event -->
        <div style="flex: none; display: flex; align-items: center; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.55)">
          <span style="width: 42px; height: 42px; border-radius: 50%; background: #F4E9FF; color: #7A2BC4; border: 2px solid #FFFFFF; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">AL</span>
          <span style="width: 42px; height: 42px; margin-left: -8px; border-radius: 50%; background: #E0F0FF; color: #0F5BA8; border: 2px solid #FFFFFF; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">KF</span>
        </div>
      </div>

      <button type="button" aria-label="Open full schedule" style="flex: none; width: 56px; height: 56px; border-radius: 50%; border: 1px solid #2C2C28; background: #1A1A17; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></button>
    </section>

    <div style="flex: none; display: flex; align-items: center; gap: 10px">
      <button type="button" aria-label="Notifications" style="position: relative; width: 56px; height: 56px; border-radius: 50%; border: 0; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 14px; right: 15px; width: 9px; height: 9px; border-radius: 50%; background: #E5484D; border: 2px solid #FFFFFF"></span></button>
      <span style="width: 56px; height: 56px; border-radius: 50%; background: #DDFAF2; color: #0E6B57; border: 3px solid #FFFFFF; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">MR</span>
    </div>
  </header>

  <!-- Row 2: workspace title · new task · stats -->
  <div style="display: flex; align-items: center; gap: 28px">
    <button type="button" aria-label="Back" style="flex: none; width: 56px; height: 56px; border-radius: 50%; border: 0; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
    <h1 style="margin: 0; font-size: 56px; font-weight: 400; letter-spacing: -0.01em; line-height: 1; display: flex; align-items: center">W<span aria-hidden="true" style="display: inline-block; width: 42px; height: 42px; margin: 0 1px; border-radius: 50%; border: 6px solid #1A1A17; box-sizing: border-box; background: #C8FF3D"></span>RKSPACE<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Workspace</span></h1>
    <button type="button" style="display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 6px; border: 0; border-radius: 999px; background: #0E0E0C; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><span style="width: 44px; height: 44px; border-radius: 50%; background: #2C2C28; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>New task</button>
    <div style="margin-left: 32px; display: flex; align-items: flex-end; gap: 64px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; align-items: flex-end; gap: 8px">
          <span style="font-size: 52px; font-weight: 300; line-height: 0.85; letter-spacing: -0.02em">{{s.n}}</span>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="align-self: flex-start; display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: {{s.bg}}; color: {{s.fg}}; font-size: 11px; font-weight: 700">{{s.delta}}</span>
            <span style="font-size: 17px; color: #5E5E58">{{s.label}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stats: [
        { n: 34, label: 'Tasks', delta: '↑ 3', bg: '#C8FF3D', fg: '#0E0E0C' },
        { n: 20, label: 'done', delta: '↑ 2', bg: '#C8FF3D', fg: '#0E0E0C' },
        { n: 3, label: 'overdue', delta: '↑ 1', bg: '#FDE7E8', fg: '#B4232A' }
      ]
    };
  }
}
</script>
</body>
</html>
